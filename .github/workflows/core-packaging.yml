name: Core packaging boundary

on:
  push:
    paths: ['plugins/**', 'sdk/**', 'src/**', 'pyproject.toml', 'MANIFEST.in', '.gitattributes', '.gitignore', '.dockerignore', 'Dockerfile', 'packaging/**', 'scripts/check_core_artifacts.py', '.github/workflows/**']
  pull_request:
    paths: ['plugins/**', 'sdk/**', 'src/**', 'pyproject.toml', 'MANIFEST.in', '.gitattributes', '.gitignore', '.dockerignore', 'Dockerfile', 'packaging/**', 'scripts/check_core_artifacts.py', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Check repository release boundaries
        run: |
          uv run --no-project --with pyyaml python plugins/scripts/test_repository.py
      - name: Build Core sdist and wheel without installing Core dependencies
        run: |
          uv build
          python scripts/check_core_artifacts.py dist/*.whl
          python scripts/check_core_artifacts.py --source dist/*.tar.gz
      - name: Verify Git export excludes plugin sources
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/core-source.tar" HEAD
          python scripts/check_core_artifacts.py --source "$RUNNER_TEMP/core-source.tar"
      - name: Verify the production Docker context exclusion
        run: |
          docker build --file - --tag langbot-packaging-boundary . <<'DOCKERFILE'
          FROM scratch
          COPY . /app
          DOCKERFILE
          docker save langbot-packaging-boundary -o "$RUNNER_TEMP/core-context.tar"
          python scripts/check_core_artifacts.py --source --docker-archive "$RUNNER_TEMP/core-context.tar"

  production-image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: langbot-ci:${{ github.sha }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build and load the production image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: langbot
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            LANGBOT_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Check the installed image without network or application startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-image-metadata"
          docker run --rm --network none --read-only --tmpfs /tmp -i \
            -e PYTHONDONTWRITEBYTECODE=1 -e EXPECTED_REVISION="$GITHUB_SHA" \
            "$IMAGE_TAG" /app/.venv/bin/python - \
            > "$RUNNER_TEMP/production-image-metadata/self-check.json" <<'PY'
          import importlib.metadata
          import inspect
          import json
          import os
          from pathlib import Path
          import shutil
          import sqlite3
          import subprocess

          import langbot_plugin
          from langbot._build_info import CORE_REVISION
          from langbot_plugin.box.client import ActionRPCBoxClient
          from langbot_plugin.box.errors import BoxArtifactNotPreparedError, BoxRuntimeCompatibilityError
          from langbot_plugin.skill_store import SkillStore

          sdk = Path(langbot_plugin.__file__).resolve()
          assert sdk == Path('/app/sdk/src/langbot_plugin/__init__.py'), sdk
          assert CORE_REVISION == os.environ['EXPECTED_REVISION'], CORE_REVISION
          assert sqlite3.sqlite_version == '3.54.1', sqlite3.sqlite_version
          for name in ('publication_inventory', 'list_publication_manifest_resources'):
              assert callable(getattr(SkillStore, name, None)), name
          assert 'max_bytes' in inspect.signature(SkillStore.export_skill_publication).parameters
          for name in ('upload_file', 'download_file', 'prepare_artifact', 'cleanup_run_files'):
              assert callable(getattr(ActionRPCBoxClient, name, None)), name
          assert issubclass(BoxArtifactNotPreparedError, RuntimeError)
          assert issubclass(BoxRuntimeCompatibilityError, RuntimeError)
          nsjail = shutil.which('nsjail')
          assert nsjail and os.access(nsjail, os.X_OK), nsjail
          cli = subprocess.run(['/app/.venv/bin/lbp', 'ver'], check=True, capture_output=True, text=True)
          ffmpeg = subprocess.run(['ffmpeg', '-version'], check=True, capture_output=True, text=True)
          print(json.dumps({
              'source_revision': CORE_REVISION,
              'sdk_source': str(sdk),
              'sdk_version': importlib.metadata.version('langbot-plugin'),
              'sqlite_version': sqlite3.sqlite_version,
              'nsjail': nsjail,
              'lbp': cli.stdout.strip(),
              'ffmpeg': ffmpeg.stdout.splitlines()[0],
          }, indent=2))
          PY
          cat "$RUNNER_TEMP/production-image-metadata/self-check.json"
      - name: Export the image and record its source and checksum
        shell: bash
        run: |
          set -euo pipefail
          image_file="production-image-${GITHUB_SHA}.tar.zst"
          docker image save "$IMAGE_TAG" | zstd -T2 -3 -o "$RUNNER_TEMP/$image_file"
          (cd "$RUNNER_TEMP" && sha256sum "$image_file") \
            > "$RUNNER_TEMP/production-image-metadata/image.sha256"
          docker image inspect "$IMAGE_TAG" > "$RUNNER_TEMP/production-image-metadata/image-inspect.json"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/production-image-metadata/source-sha.txt"
          cat "$RUNNER_TEMP/production-image-metadata/image.sha256"
          docker image inspect "$IMAGE_TAG" --format '{{.Id}} {{index .Config.Labels "org.opencontainers.image.revision"}}'
      - name: Upload the production image for Linux acceptance
        uses: actions/upload-artifact@v4
        with:
          name: production-image-${{ github.sha }}
          path: ${{ runner.temp }}/production-image-${{ github.sha }}.tar.zst
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload image verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: production-image-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/production-image-metadata/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
