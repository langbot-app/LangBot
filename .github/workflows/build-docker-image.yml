name: Build Docker Image
on:
  ## 发布release的时候会自动构建
  release:
    types: [published]
jobs:
  publish-docker-image:
    if: ${{ !startsWith(github.event.release.tag_name, 'plugins/') && startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    name: Build image
    
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false
          # Tags are needed to compare sdk/ with the pinned SDK release tag.
          fetch-depth: 0

      - name: Check the pinned SDK matches the in-tree SDK release
        run: python3 scripts/check_sdk_release_pin.py

      - name: judge has env GITHUB_REF  # 如果没有GITHUB_REF环境变量，则把github.ref变量赋值给GITHUB_REF
        run: |
          if [ -z "$GITHUB_REF" ]; then
            export GITHUB_REF=${{ github.ref }}
            echo $GITHUB_REF
          fi
      - name: Check version
        id: check_version
        run: |
          echo $GITHUB_REF
          # 如果是tag，则去掉refs/tags/前缀
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "It's a tag"
            echo $GITHUB_REF
            echo $GITHUB_REF | awk -F '/' '{print $3}'
            echo ::set-output name=version::$(echo $GITHUB_REF | awk -F '/' '{print $3}')
          else
            echo "It's not a tag"
            echo $GITHUB_REF
            echo ::set-output name=version::${GITHUB_REF}
          fi
      - name: Login to Registry
        run: docker login --username=${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.DOCKER_PASSWORD }}
      - name: Create Buildx
        run: docker buildx create --name mybuilder --use
      # Every release publishes the default image plus one variant per optional
      # vector-store extra, all from the same Dockerfile:
      #   rockchin/langbot:<tag>           default image
      #   rockchin/langbot:<tag>-<extra>   default image + that extra (seekdb, milvus, valkey)
      # Each variant is one extra layer on top of the default image.
      - name: Build for Release # only relase, exlude pre-release
        if: ${{ github.event.release.prerelease == false }}
        env:
          RELEASE_VERSION: ${{ steps.check_version.outputs.version }}
        run: |
          for extra in "" seekdb milvus valkey; do
            if [ -z "$extra" ]; then
              suffix=""; target=(--target langbot)
            else
              suffix="-$extra"; target=(--target langbot-extra --build-arg "LANGBOT_EXTRA=$extra")
            fi
            docker buildx build --build-arg LANGBOT_BUILD_REVISION=${{ github.sha }} --platform linux/arm64,linux/amd64 \
              "${target[@]}" \
              -t "rockchin/langbot:${RELEASE_VERSION}${suffix}" -t "rockchin/langbot:latest${suffix}" . --push
          done
      - name: Build for Pre-release # no update for latest tag
        if: ${{ github.event.release.prerelease == true }}
        env:
          RELEASE_VERSION: ${{ steps.check_version.outputs.version }}
        run: |
          for extra in "" seekdb milvus valkey; do
            if [ -z "$extra" ]; then
              suffix=""; target=(--target langbot)
            else
              suffix="-$extra"; target=(--target langbot-extra --build-arg "LANGBOT_EXTRA=$extra")
            fi
            tags=(-t "rockchin/langbot:${RELEASE_VERSION}${suffix}")
            if [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              tags+=(-t "rockchin/langbot:beta${suffix}")
            fi
            docker buildx build --build-arg LANGBOT_BUILD_REVISION=${{ github.sha }} --platform linux/arm64,linux/amd64 \
              "${target[@]}" "${tags[@]}" . --push
          done
