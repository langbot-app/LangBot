name: Plugins / Plugin catalog

on:
  push:
    paths: ["plugins/**", ".github/workflows/plugins-*.yml"]
  pull_request:
    paths: ["plugins/**", ".github/workflows/plugins-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - run: python plugins/scripts/check_catalog.py
      - run: python plugins/scripts/test_repository.py
