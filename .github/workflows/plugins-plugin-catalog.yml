name: Plugins / Plugin catalog

on:
  pull_request:
    paths: ["plugins/**", ".github/workflows/plugins-*.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: plugin-catalog-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - run: python plugins/scripts/check_catalog.py
      - run: python plugins/scripts/test_repository.py
