name: SDK / Tests

# The standalone SDK keeps its independent environment; Core consumers use the
# locked in-tree SDK in the Core workflows.
on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/generate_plugin_workspace_api.py'
      - 'scripts/check_sdk_release_pin.py'
      - 'Dockerfile'
      - 'packaging/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/classify_test_changes.py'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sdk-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-host:
    name: Windows host Box
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 pytest -qs tests/box/test_windows_host_backend.py
        working-directory: sdk
      - run: uv run --python 3.12 pytest -q tests/unit_tests/provider/test_tool_manager_native.py -k host_executes

  scope:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/classify-test-changes
      - id: matrix
        shell: bash
        env:
          FULL: ${{ github.event_name != 'pull_request' || steps.changes.outputs.compatibility == 'true' || steps.changes.outputs.packaging == 'true' }}
        run: |
          versions='["3.12"]'
          if [[ "$FULL" == true ]]; then
            versions='["3.10","3.11","3.12","3.13","3.14"]'
          fi
          printf 'versions=%s\n' "$versions" >> "$GITHUB_OUTPUT"

  unit-tests:
    name: Unit Tests
    needs: scope
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sdk/pyproject.toml
      - name: Run tests with coverage
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv run --python "$PYTHON_VERSION" pytest \
            --ignore=tests/packaging \
            --cov=langbot_plugin \
            --cov-report=term-missing \
            --cov-fail-under=84 \
            --junitxml="$RUNNER_TEMP/sdk-unit.xml"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sdk-unit-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-unit.xml

  sdk-checks:
    name: SDK lint, type, protocol and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sdk/pyproject.toml
      - id: install
        name: Install SDK development environment
        run: uv sync --python 3.12
      - name: Ruff check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync ruff check src tests --output-format=concise
      - name: Ruff format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync ruff format --check src tests
      - name: Mypy scoped modules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync mypy
      - name: Check action enum / proxy / handler consistency
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync python scripts/check_action_consistency.py
      - name: Installed wheel CLI smoke
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run --no-sync pytest -q tests/packaging --junitxml="$RUNNER_TEMP/sdk-package.xml"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          name: sdk-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-package.xml
