name: Docs tests

on:
  pull_request:
    paths: ['docs/**', '.github/workflows/*docs*.yml', '.github/workflows/sync-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Fumapress docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
