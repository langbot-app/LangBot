name: Docs tests

on:
  pull_request:
    paths: ['docs/**', '.github/workflows/*docs*.yml', '.github/workflows/sync-github-wiki.yml', '.github/workflows/sync-blog-articles.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Fumapress docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
