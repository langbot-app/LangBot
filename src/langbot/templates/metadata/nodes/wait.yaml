# Wait Node Configuration
# This file defines the metadata for the Wait workflow node
# The corresponding Python implementation is in: pkg/workflow/nodes/wait.py

name: wait
label:
  en_US: Wait
  zh_Hans: 等待
category: control
icon: Clock
color: '#8b5cf6'
description:
  en_US: Pause workflow execution for a specified duration
  zh_Hans: 暂停工作流执行指定时间

inputs:
  - name: input
    type: any
    required: false
    label:
      en_US: Input
      zh_Hans: 输入
    description:
      en_US: Input to pass through
      zh_Hans: 传递的输入

outputs:
  - name: output
    type: any
    label:
      en_US: Output
      zh_Hans: 输出
    description:
      en_US: Passed through input
      zh_Hans: 传递的输入

config:
  - name: duration
    type: integer
    default: 5
    label:
      en_US: Duration (seconds)
      zh_Hans: 时长（秒）
    description:
      en_US: Number of seconds to wait
      zh_Hans: 等待的秒数
