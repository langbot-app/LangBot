# Send Message Node Configuration
# This file defines the metadata for the Send Message workflow node
# The corresponding Python implementation is in: pkg/workflow/nodes/send_message.py

name: send_message
label:
  en_US: Send Message
  zh_Hans: 发送消息
category: action
icon: MessageCircle
color: '#10b981'
description:
  en_US: Send a message through the triggering bot to a person or group
  zh_Hans: 通过触发工作流的机器人向指定私聊或群聊发送消息

inputs:
  - name: content
    type: string
    required: false
    label:
      en_US: Content
      zh_Hans: 内容
    description:
      en_US: Message content to send
      zh_Hans: 要发送的消息内容
  - name: target_id
    type: string
    required: false
    label:
      en_US: Target ID
      zh_Hans: 目标 ID
    description:
      en_US: Overrides the configured target ID
      zh_Hans: 覆盖配置中的目标 ID

outputs:
  - name: status
    type: string
    label:
      en_US: Status
      zh_Hans: 状态
    description:
      en_US: Send status
      zh_Hans: 发送状态

config:
  - name: target_type
    type: select
    default: person
    options: ["person", "group"]
    label:
      en_US: Target Type
      zh_Hans: 目标类型
    description:
      en_US: Whether the target is a private chat or a group
      zh_Hans: 目标是私聊还是群聊

  - name: target_id
    type: string
    default: ""
    label:
      en_US: Target ID
      zh_Hans: 目标 ID
    description:
      en_US: Platform user or group ID; leave empty to send to the triggering conversation
      zh_Hans: 平台用户或群 ID；留空则发送到触发工作流的会话
