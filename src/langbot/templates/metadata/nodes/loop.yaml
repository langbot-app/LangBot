# Loop Node Configuration
# This file defines the metadata for the Loop workflow node
# The corresponding Python implementation is in: pkg/workflow/nodes/loop.py

name: loop
label:
  en_US: Loop
  zh_Hans: 循环
category: control
icon: Repeat
color: '#8b5cf6'
description:
  en_US: Iterate over items or repeat until condition
  zh_Hans: 遍历项目或重复直到满足条件

inputs:
  - name: items
    type: array
    required: false
    label:
      en_US: Items
      zh_Hans: 项目
    description:
      en_US: Items to iterate over
      zh_Hans: 要遍历的项目

outputs:
  - name: item
    type: any
    label:
      en_US: Item
      zh_Hans: 当前项
    description:
      en_US: Current item in iteration
      zh_Hans: 迭代中的当前项
  - name: index
    type: number
    label:
      en_US: Index
      zh_Hans: 索引
    description:
      en_US: Current iteration index
      zh_Hans: 当前迭代索引
  - name: completed
    type: any
    label:
      en_US: Completed
      zh_Hans: 完成
    description:
      en_US: Output after loop completes
      zh_Hans: 循环完成后的输出

config:
  - name: max_iterations
    type: integer
    default: 100
    label:
      en_US: Max Iterations
      zh_Hans: 最大迭代次数
    description:
      en_US: Maximum number of iterations
      zh_Hans: 最大迭代次数
