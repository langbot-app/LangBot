name: parameter_extractor
label:
  en_US: Parameter Extractor
  zh_Hans: 参数提取器
category: process
icon: Variable
color: '#8b5cf6'
description:
  en_US: Extract structured parameters from text using AI
  zh_Hans: 使用 AI 从文本中提取结构化参数
inputs:
- name: input
  type: string
  label:
    en_US: Text
    zh_Hans: 文本
  description:
    en_US: Text to extract parameters from
    zh_Hans: 要提取参数的文本
outputs:
- name: parameters
  type: object
  label:
    en_US: Parameters
    zh_Hans: 参数
  description:
    en_US: Extracted parameters as key-value pairs
    zh_Hans: 提取的参数键值对
- name: extraction_success
  type: boolean
  label:
    en_US: Success
    zh_Hans: 成功
  description:
    en_US: Whether all required parameters were extracted
    zh_Hans: 是否所有必需参数都已提取
config:
- name: model
  type: llm-model-selector
  required: true
  label:
    en_US: Extraction Model
    zh_Hans: 提取模型
  description:
    en_US: Select the model for parameter extraction
    zh_Hans: 选择用于参数提取的模型
- name: parameters
  type: textarea
  required: true
  default: '[]'
  label:
    en_US: Parameters Schema
    zh_Hans: 参数架构
  description:
    en_US: JSON array defining expected parameters
    zh_Hans: 定义期望参数的 JSON 数组
