      en_US: Context data
      zh_Hans: 上下文数据
    required: false

outputs:
  - name: response
    type: string
    label:
      en_US: Response
      zh_Hans: 响应
    description:
      en_US: Chat response
      zh_Hans: 聊天响应
  - name: result
    type: object
    label:
      en_US: Result
      zh_Hans: 结果
    description:
      en_US: Chat result
      zh_Hans: 聊天结果

config:
  - name: pipeline_uuid
    type: pipeline-selector
    required: true
    label:
      en_US: Chat
      zh_Hans: 聊天
    description:
      en_US: Chat to call
      zh_Hans: 要调用的聊天
