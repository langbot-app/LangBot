name: output
label:
  en_US: Output Processing
  zh_Hans: 输出处理
stages:
  - name: misc
    label:
      en_US: Misc
      zh_Hans: 杂项
    config:
      - name: tool-call-hint
        label:
          en_US: Tool Call Hint
          zh_Hans: 工具调用提示
        description:
          en_US: "Leave empty to use the Workspace language. Use {tools} for tool names. Requires Track Function Calls."
          zh_Hans: "留空时使用工作区语言的默认提示。 可用 {tools} 插入工具名称，需开启跟踪函数调用。"
        type: string
        required: false
        default: ''
      - name: runner-not-found-hint
        label:
          en_US: Runner Missing Hint
          zh_Hans: 运行器不存在提示
        description:
          en_US: "Leave empty to use the Workspace language. Use {runner} for the runner ID."
          zh_Hans: "留空时使用工作区语言的默认提示。 可用 {runner} 插入运行器 ID。"
        type: string
        required: false
        default: ''
      - name: runner-not-authorized-hint
        label:
          en_US: Runner Authorization Hint
          zh_Hans: 运行器未授权提示
        description:
          en_US: "Leave empty to use the Workspace language."
          zh_Hans: "留空时使用工作区语言的默认提示。"
        type: string
        required: false
        default: ''
      - name: runner-unavailable-hint
        label:
          en_US: Runner Unavailable Hint
          zh_Hans: 运行器不可用提示
        description:
          en_US: "Leave empty to use the Workspace language."
          zh_Hans: "留空时使用工作区语言的默认提示。"
        type: string
        required: false
        default: ''
      - name: track-function-calls
        label:
          en_US: Track Function Calls
          zh_Hans: 跟踪函数调用
        description:
          en_US: If enabled, the function calls will be tracked and output to the user
          zh_Hans: 启用后，Agent 每次调用工具时都会输出一个提示给用户
        type: boolean
        required: true
        default: false
      - name: remove-think
        label:
          en_US: Remove CoT
          zh_Hans: 删除思维链
        description:
          en_US: 'If enabled, LangBot will remove the LLM thought content in response. Note: When using streaming response, removing CoT may cause the first token to wait for a long time.'
          zh_Hans: '如果启用，将自动删除大模型回复中的模型思考内容。注意：当您使用流式响应时，删除思维链可能会导致首个 Token 的等待时间过长'
        type: boolean
        required: true
        default: false
