name: output
label:
  en_US: Reply
  zh_Hans: 回复
stages:
  - name: long-text-processing
    label:
      en_US: Long Text Processing
      zh_Hans: 长文本处理
    config:
      - name: threshold
        label:
          en_US: Threshold
          zh_Hans: 阈值
        description:
          en_US: The threshold of the long text
          zh_Hans: 超过此长度的文本将被处理
        type: integer
        required: true
        default: 1000
      - name: strategy
        label:
          en_US: Strategy
          zh_Hans: 策略
        description:
          en_US: The strategy of the long text
          zh_Hans: 长文本的处理策略
        type: select
        required: true
        default: none
        options:
          - name: forward
            label:
              en_US: Forward Message Component
              zh_Hans: 转换为转发消息组件（部分平台不支持）
          - name: image
            label:
              en_US: Convert to Image
              zh_Hans: 转换为图片
          - name: none
            label:
              en_US: None
              zh_Hans: 不处理
      - name: font-path
        label:
          en_US: Font Path
          zh_Hans: 字体路径
        description:
          en_US: The path of the font to be used when converting to image
          zh_Hans: 选用转换为图片时，所使用的字体路径
        type: string
        required: false
        default: ''
  - name: force-delay
    label:
      en_US: Force Delay
      zh_Hans: 强制延迟
    description:
      en_US: Force the output to be delayed for a while
      zh_Hans: 强制延迟一段时间后再回复给用户
    config:
      - name: min
        label:
          en_US: Min Seconds
          zh_Hans: 最小秒数
        type: integer
        required: true
        default: 0
      - name: max
        label:
          en_US: Max Seconds
          zh_Hans: 最大秒数
        type: integer
        required: true
        default: 0
  - name: misc
    label:
      en_US: Misc
      zh_Hans: 杂项
    config:
      - name: exception-handling
        label:
          en_US: Exception Handling Strategy
          zh_Hans: 异常处理策略
        description:
          en_US: Controls how error messages are displayed to the user when handling a message fails
          zh_Hans: 控制消息处理失败时向用户展示错误信息的方式
        type: select
        required: true
        default: show-hint
        options:
          - name: show-error
            label:
              en_US: Show Full Error
              zh_Hans: 显示完整报错信息
          - name: show-hint
            label:
              en_US: Show Failure Hint
              zh_Hans: 仅文字提示
          - name: hide
            label:
              en_US: Hide All
              zh_Hans: 不显示任何异常信息
      - name: failure-hint
        label:
          en_US: Failure Hint Text
          zh_Hans: 失败提示文本
        description:
          en_US: Leave empty to use the Workspace language. Used for request and runner execution failures; custom text is not translated.
          zh_Hans: 留空时使用工作区语言的默认提示。用于请求和运行器执行失败；自定义文本不会自动翻译。
        type: string
        required: false
        default: ''
      - name: rate-limit-hint
        label:
          en_US: Rate Limit Hint
          zh_Hans: 限速提示
        description:
          en_US: "Leave empty to use the Workspace language."
          zh_Hans: "留空时使用工作区语言的默认提示。"
        type: string
        required: false
        default: ''
      - name: content-filter-hint
        label:
          en_US: Content Filter Hint
          zh_Hans: 内容过滤提示
        description:
          en_US: "Leave empty to use the Workspace language."
          zh_Hans: "留空时使用工作区语言的默认提示。"
        type: string
        required: false
        default: ''
      - name: content-filter-error-hint
        label:
          en_US: Content Check Failure Hint
          zh_Hans: 内容检查失败提示
        description:
          en_US: "Leave empty to use the Workspace language."
          zh_Hans: "留空时使用工作区语言的默认提示。"
        type: string
        required: false
        default: ''
      - name: at-sender
        label:
          en_US: At Sender
          zh_Hans: 在群聊回复中@发送者
        type: boolean
        required: true
        default: true
      - name: quote-origin
        label:
          en_US: Quote Origin Message
          zh_Hans: 引用原消息
        type: boolean
        required: true
        default: false
