apiVersion: v1
kind: LLMAPIRequester
metadata:
  name: martllm-chat-completions
  label:
    en_US: MartLLM
    zh_Hans: MartLLM
  icon: martllm.svg
spec:
  litellm_provider: openai
  config:
  - name: base_url
    label:
      en_US: Base URL
      zh_Hans: 基础 URL
    type: string
    required: true
    default: https://api.martllm.com/v1
  - name: timeout
    label:
      en_US: Timeout
      zh_Hans: 超时时间
    type: integer
    required: true
    default: 120
  alias: "martllm MartLLM uberllm UberLLM gpt claude gemini deepseek qwen kimi glm llama openai-compatible"
  support_type:
  - llm
  provider_category: maas
