apiVersion: v1
kind: LLMAPIRequester
metadata:
  name: nvidia-chat-completions
  label:
    en_US: NVIDIA NIM
    zh_Hans: NVIDIA NIM
  icon: nvidia.svg
spec:
  litellm_provider: openai
  config:
  - name: base_url
    label:
      en_US: Base URL
      zh_Hans: 基础 URL
    type: string
    required: true
    default: https://integrate.api.nvidia.com/v1
  - name: timeout
    label:
      en_US: Timeout
      zh_Hans: 超时时间
    type: integer
    required: true
    default: 120
  alias: "nvidia NVIDIA nim NIM nemotron Nemotron 英伟达 build.nvidia.com"
  support_type:
  - llm
  provider_category: manufacturer
