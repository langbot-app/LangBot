apiVersion: v1
kind: MessagePlatformAdapter

metadata:
  name: dingtalk-omni
  label:
    en_US: DingTalk
    zh_Hans: 钉钉
    zh_Hant: 釘釘
  description:
    en_US: DingTalk adapter with event-driven orchestration support
    zh_Hans: 钉钉适配器，支持事件驱动编排
    zh_Hant: 釘釘適配器，支援事件驅動編排
  icon: dingtalk.svg

spec:
  categories:
    - popular
    - china
  help_links:
    zh: https://langbot.app/docs/zh/usage/platforms/dingtalk
    en: https://langbot.app/docs/en/usage/platforms/dingtalk
    ja: https://langbot.app/docs/ja/usage/platforms/dingtalk
  config:
    - name: one-click-create
      label:
        en_US: One-Click Create App
        zh_Hans: 一键创建应用
        zh_Hant: 一鍵建立應用
      description:
        en_US: Scan with DingTalk to create an app and automatically fill in credentials. The bot identity is resolved automatically.
        zh_Hans: 使用钉钉扫码创建应用并自动填写凭据，机器人身份会自动识别。
        zh_Hant: 使用釘釘掃碼建立應用並自動填寫憑證，機器人身分會自動識別。
      type: qr-code-login
      login_platform: dingtalk
      required: false
    - name: client_id
      label:
        en_US: Client ID
        zh_Hans: 客户端ID
        zh_Hant: 用戶端ID
      type: string
      required: true
      default: ""
    - name: client_secret
      label:
        en_US: Client Secret
        zh_Hans: 客户端密钥
        zh_Hant: 用戶端密鑰
      type: string
      required: true
      default: ""
    - name: markdown_card
      label:
        en_US: Use Card Replies
        zh_Hans: 使用卡片回复
        zh_Hant: 使用卡片回覆
      description:
        en_US: Uses built-in A2UI cards for Markdown, streaming replies, and interactions. No card template is required. The app must have AICard.Instance.Write permission.
        zh_Hans: 使用内置 A2UI 卡片提供 Markdown、流式回复和交互能力，无需配置卡片模板。应用必须开通 AICard.Instance.Write 权限。
        zh_Hant: 使用內建 A2UI 卡片提供 Markdown、串流回覆和互動能力，無需設定卡片範本。應用必須開通 AICard.Instance.Write 權限。
      type: boolean
      required: false
      default: true

  supported_events:
    - message.received
    - feedback.received
    - group.member_joined
    - group.member_left
    - group.info_updated
    - dingtalk.card_action
    - platform.specific

  supported_apis:
    required:
      - send_message
      - reply_message
    optional:
      - get_message
      - get_group_info
      - get_group_list
      - get_group_member_info
      - get_user_info
      - get_friend_list
      - get_file_url
      - call_platform_api
      - interaction.request

  platform_specific_apis:
    - action: check_access_token
      description: { en_US: "Check whether the current DingTalk access token is usable", zh_Hans: "检查当前钉钉 access token 是否可用" }
    - action: refresh_access_token
      description: { en_US: "Refresh the DingTalk access token", zh_Hans: "刷新钉钉 access token" }
    - action: get_file_url
      description: { en_US: "Resolve a DingTalk download code to a file URL", zh_Hans: "将钉钉 downloadCode 解析为文件 URL" }
    - action: get_audio_base64
      description: { en_US: "Download DingTalk audio as base64 by download code", zh_Hans: "通过 downloadCode 下载钉钉语音并转为 base64" }
    - action: download_image_base64
      description: { en_US: "Download DingTalk image as base64 by download code", zh_Hans: "通过 downloadCode 下载钉钉图片并转为 base64" }

execution:
  python:
    path: ./adapter.py
    attr: DingTalkAdapter
