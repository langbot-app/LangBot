apiVersion: v1
kind: MessagePlatformAdapter

metadata:
  name: officialaccount-omni
  label:
    en_US: Official Account
    zh_Hans: 微信公众号
    zh_Hant: 微信公眾號
  description:
    en_US: WeChat Official Account adapter with event-driven orchestration support
    zh_Hans: 微信公众号适配器，支持事件驱动编排，通过统一 Webhook 接收公众号消息
    zh_Hant: 微信公眾號適配器，支援事件驅動編排，透過統一 Webhook 接收公眾號訊息
  icon: officialaccount.png

spec:
  categories:
    - china
  help_links:
    zh: https://langbot.app/docs/zh/usage/platforms/wxoa
    en: https://langbot.app/docs/en/usage/platforms/wxoa
    ja: https://langbot.app/docs/ja/usage/platforms/wxoa
  config:
    - name: __system.outbound_ips
      label:
        en_US: IP Whitelist
        zh_Hans: IP 白名单
        zh_Hant: IP 白名單
      description:
        en_US: Add these outbound IPs of the LangBot server to the IP whitelist in the "Basic Configuration" of the WeChat Official
          Account platform
        zh_Hans: 请将这些 LangBot 服务器的出网 IP 添加到微信公众平台「基本配置」中的 IP 白名单
        zh_Hant: 請將這些 LangBot 伺服器的出網 IP 加入微信公眾平台「基本配置」中的 IP 白名單
      type: array[string]
      required: false
      default: []
    - name: AppID
      label:
        en_US: App ID
        zh_Hans: 应用 ID
        zh_Hant: 應用 ID
      type: string
      required: true
      default: ""
    - name: AppSecret
      label:
        en_US: App Secret
        zh_Hans: 应用密钥
        zh_Hant: 應用密鑰
      type: string
      required: true
      default: ""
    - name: webhook_url
      label:
        en_US: Webhook Callback URL
        zh_Hans: Webhook 回调地址
        zh_Hant: Webhook 回調地址
      description:
        en_US: Copy this URL and paste it into your Official Account webhook configuration.
        zh_Hans: 复制此地址并粘贴到微信公众号的 Webhook 配置中。
        zh_Hant: 複製此地址並貼到微信公眾號的 Webhook 設定中。
      type: webhook-url
      required: false
      default: ""
    - name: token
      label:
        en_US: Token
        zh_Hans: 令牌
        zh_Hant: 令牌
      type: string
      required: true
      default: ""
    - name: EncodingAESKey
      label:
        en_US: EncodingAESKey
        zh_Hans: 消息加解密密钥
        zh_Hant: 訊息加解密密鑰
      type: string
      required: true
      default: ""
    - name: Mode
      label:
        en_US: Mode
        zh_Hans: 接入模式
        zh_Hant: 接入模式
      description:
        en_US: "Auto uses customer service messaging when available, falling back to next-message retrieval for permission, window or quota limits. Passive always waits for the next message. Drop requires a reply within 5 seconds."
        zh_Hans: "自动模式在生成完成后通过客服接口回复；无权限、超出回复窗口或额度不足时，改为下一条消息领取。passive 始终由下一条消息领取；drop 需要在 5 秒内完成回复。客服接口通常需企业主体认证，以微信实际权限为准。"
        zh_Hant: "自動模式在生成完成後透過客服介面回覆；無權限、超出回覆時限或額度不足時，改為下一則訊息領取。passive 始終由下一則訊息領取；drop 需要在 5 秒內完成回覆。客服介面通常需企業主體認證，以微信實際權限為準。"
      type: select
      options:
        - name: auto
          label:
            en_US: Automatic reply with fallback (auto)
            zh_Hans: 自动回复，受限时转为领取（auto）
            zh_Hant: 自動回覆，受限時轉為領取（auto）
        - name: drop
          label:
            en_US: Reply in current callback (drop)
            zh_Hans: 当前回调内回复（drop）
            zh_Hant: 目前回調內回覆（drop）
        - name: passive
          label:
            en_US: Queue reply for next message (passive)
            zh_Hans: 下一条消息时返回回复（passive）
            zh_Hant: 下一則訊息時傳回回覆（passive）
      required: true
      default: "drop"
    - name: LoadingMessage
      label:
        en_US: Loading Message
        zh_Hans: 加载消息
        zh_Hant: 載入訊息
      type: string
      required: false
      default: "AI正在思考中，请发送任意内容获取回复。"
    - name: api_base_url
      label:
        en_US: API Base URL
        zh_Hans: API 基础 URL
        zh_Hant: API 基礎 URL
      description:
        en_US: Optional Official Account API base URL, useful when routing through a reverse proxy.
        zh_Hans: 可选，若通过反向代理访问微信公众号 API，可修改此项。
        zh_Hant: 可選，若透過反向代理存取微信公眾號 API，可修改此項。
      type: string
      required: false
      default: "https://api.weixin.qq.com"

  supported_events:
    - message.received
    - platform.specific

  supported_apis:
    required:
      - reply_message
    optional:
      - get_message
      - get_user_info
      - get_friend_list
      - call_platform_api

  platform_specific_apis:
    - action: get_mode
      description: { en_US: "Return the configured Official Account reply mode", zh_Hans: "返回当前微信公众号回复模式" }
    - action: get_cached_response_status
      description: { en_US: "Inspect cached passive/drop reply state for diagnostics", zh_Hans: "查看被动回复缓存状态，用于诊断" }

execution:
  python:
    path: ./adapter.py
    attr: OfficialAccountAdapter
