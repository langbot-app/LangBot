apiVersion: v1
kind: MessagePlatformAdapter

metadata:
  name: slack-omni
  label:
    en_US: Slack
    zh_Hans: Slack
    zh_Hant: Slack
  description:
    en_US: Slack adapter with event-driven orchestration, supporting Webhook and Socket Mode.
    zh_Hans: Slack 适配器，支持事件驱动编排，可使用 Webhook 或无需公网地址的长连接。
    zh_Hant: Slack 適配器，支援事件驅動編排，可使用 Webhook 或無需公開網址的長連線。
  icon: slack.png

spec:
  categories:
    - popular
    - global
  help_links:
    zh: https://langbot.app/docs/zh/usage/platforms/slack
    en: https://langbot.app/docs/en/usage/platforms/slack
    ja: https://langbot.app/docs/ja/usage/platforms/slack
  config:
    - name: quick_setup
      label: {en_US: Quick Slack setup, zh_Hans: Slack 快速配置, zh_Hant: Slack 快速設定, ja_JP: Slack クイック設定}
      description: {en_US: Create and configure an app using App Configuration Tokens., zh_Hans: 填入配置令牌，自动创建应用并配置权限，授权后填入凭据。, zh_Hant: 填入設定權杖，自動建立應用程式並設定權限，授權後填入憑證。, ja_JP: 設定トークンでアプリを作成し、承認後に認証情報を入力します。}
      type: qr-code-login
      login_platform: slack
      required: false
    - name: socket_mode
      label: {en_US: Socket Mode, zh_Hans: 长连接模式, zh_Hant: 長連線模式, ja_JP: Socket Mode}
      type: boolean
      default: false
      required: false
    - name: app_token
      label: {en_US: App-Level Token, zh_Hans: App-Level Token, zh_Hant: App-Level Token, ja_JP: App-Level Token}
      description: {en_US: Generate an xapp- token with connections:write in Basic Information., zh_Hans: 在 Basic Information 中生成带 connections:write 权限的 xapp- 令牌。, zh_Hant: 在 Basic Information 產生具有 connections:write 權限的 xapp- 權杖。, ja_JP: Basic Information で connections:write 権限の xapp- トークンを生成してください。}
      type: string
      required: false
      default: ''
      show_if: {field: socket_mode, operator: eq, value: true}
    - name: webhook_url
      show_if: {field: socket_mode, operator: eq, value: false}
      label:
        en_US: Webhook Callback URL
        zh_Hans: Webhook 回调地址
        zh_Hant: Webhook 回調地址
      description:
        en_US: Copy this URL and paste it into your Slack app's event subscription configuration.
        zh_Hans: 复制此地址并粘贴到 Slack 应用的事件订阅配置中。
        zh_Hant: 複製此地址並貼到 Slack 應用的事件訂閱設定中。
      type: webhook-url
      required: false
      default: ""
    - name: bot_token
      label:
        en_US: Bot Token
        zh_Hans: 机器人令牌
        zh_Hant: 機器人令牌
      type: string
      required: true
      default: ""
    - name: signing_secret
      show_if: {field: socket_mode, operator: eq, value: false}
      label:
        en_US: Signing Secret
        zh_Hans: 签名密钥
        zh_Hant: 簽名密鑰
      type: string
      required: false
      default: ""

  supported_events:
    - message.received
    - message.edited
    - message.deleted
    - message.reaction
    - group.member_joined
    - group.member_left
    - group.info_updated
    - bot.invited_to_group
    - bot.removed_from_group
    - platform.specific

  supported_apis:
    required:
      - send_message
      - reply_message
    optional:
      - get_message
      - get_user_info
      - get_friend_list
      - get_group_info
      - get_group_list
      - get_group_member_list
      - get_group_member_info
      - call_platform_api

  platform_specific_apis:
    - action: get_mode
      description: { en_US: "Return adapter webhook mode", zh_Hans: "返回适配器 Webhook 模式" }
    - action: auth_test
      description: { en_US: "Call Slack auth.test with the configured bot token", zh_Hans: "使用配置的机器人令牌调用 Slack auth.test" }

execution:
  python:
    path: ./adapter.py
    attr: SlackAdapter
