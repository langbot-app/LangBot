apiVersion: v1
kind: MessagePlatformAdapter

metadata:
  name: wecombot-omni
  label:
    en_US: WeComBot
    zh_Hans: 企业微信智能机器人
    zh_Hant: 企業微信智慧機器人
  description:
    en_US: Answer questions and assist teams in WeCom chats and groups
    zh_Hans: 在企业微信单聊和群聊中提供智能问答与协作
    zh_Hant: 在企業微信單聊和群聊中提供智慧問答與協作
  icon: wecombot.png

spec:
  categories:
    - china
  help_links:
    zh: https://langbot.app/docs/zh/usage/platforms/wecom/wecombot
    en: https://langbot.app/docs/en/usage/platforms/wecom/wecombot
    ja: https://langbot.app/docs/ja/usage/platforms/wecom/wecombot
  config:
    - name: one-click-create
      label:
        en_US: One-Click Create Bot
        zh_Hans: 一键创建机器人
        zh_Hant: 一鍵建立機器人
      description:
        en_US: Scan with WeCom to create a bot and fill in BotId and Secret automatically.
        zh_Hans: 使用企业微信扫码自动创建机器人并填写 BotId 和 Secret。
        zh_Hant: 使用企業微信掃碼自動建立機器人並填寫 BotId 和 Secret。
      type: qr-code-login
      login_platform: wecombot
      required: false
    - name: __system.outbound_ips
      label:
        en_US: Trusted IPs
        zh_Hans: 企业可信 IP
        zh_Hant: 企業可信 IP
      description:
        en_US: Add these outbound IPs of the LangBot server to the "Trusted Enterprise IPs" of the bot configuration in the WeCom
          admin console
        zh_Hans: 请将这些 LangBot 服务器的出网 IP 添加到企业微信管理后台智能机器人配置的「企业可信 IP」中
        zh_Hant: 請將這些 LangBot 伺服器的出網 IP 加入企業微信管理後台智慧機器人設定的「企業可信 IP」中
      type: array[string]
      required: false
      default: []
    - name: BotId
      label:
        en_US: BotId
        zh_Hans: 机器人ID (BotId)
        zh_Hant: 機器人ID (BotId)
      type: string
      required: true
      default: ""
    - name: robot_name
      label:
        en_US: Robot Name
        zh_Hans: 机器人名称
        zh_Hant: 機器人名稱
      description:
        en_US: Optional. Only removes matching @name text in group messages; bot mentions are identified by BotId.
        zh_Hans: 可选。仅用于清理群消息中的 @名称 文本，机器人提及通过 BotId 识别。
        zh_Hant: 選填。僅用於清理群訊息中的 @名稱 文字，機器人提及透過 BotId 識別。
      type: string
      required: false
      default: ""
    - name: enable-webhook
      label:
        en_US: Enable Webhook Mode
        zh_Hans: 启用 Webhook 模式
        zh_Hant: 啟用 Webhook 模式
      description:
        en_US: If enabled, the bot will use webhook mode. Otherwise it uses WebSocket long connection mode and does not need a webhook URL.
        zh_Hans: 如果启用，机器人将使用 Webhook 模式；否则使用 WebSocket 长连接模式，不需要配置 webhook URL。
        zh_Hant: 如果啟用，機器人將使用 Webhook 模式；否則使用 WebSocket 長連線模式，不需要設定 webhook URL。
      type: boolean
      required: true
      default: false
    - name: webhook_url
      label:
        en_US: Webhook Callback URL
        zh_Hans: Webhook 回调地址
        zh_Hant: Webhook 回調地址
      description:
        en_US: Copy this URL into WeComBot callback settings only when webhook mode is enabled.
        zh_Hans: 仅在启用 Webhook 模式时复制此地址到企业微信智能机器人回调配置中。
        zh_Hant: 僅在啟用 Webhook 模式時複製此地址到企業微信智慧機器人回調設定中。
      type: webhook-url
      required: false
      default: ""
      show_if:
        field: enable-webhook
        operator: eq
        value: true
    - name: Secret
      label:
        en_US: Secret
        zh_Hans: 机器人密钥 (Secret)
        zh_Hant: 機器人密鑰 (Secret)
      description:
        en_US: Required for WebSocket long connection mode.
        zh_Hans: 使用 WebSocket 长连接模式时必填。
        zh_Hant: 使用 WebSocket 長連線模式時必填。
      type: string
      required: false
      default: ""
      show_if:
        field: enable-webhook
        operator: neq
        value: true
    - name: Corpid
      label:
        en_US: Corpid
        zh_Hans: 企业ID
        zh_Hant: 企業ID
      description:
        en_US: Required for webhook mode.
        zh_Hans: 使用 Webhook 模式时必填。
        zh_Hant: 使用 Webhook 模式時必填。
      type: string
      required: false
      default: ""
      show_if:
        field: enable-webhook
        operator: eq
        value: true
    - name: Token
      label:
        en_US: Token
        zh_Hans: 令牌 (Token)
        zh_Hant: 令牌 (Token)
      description:
        en_US: Required for webhook mode.
        zh_Hans: 使用 Webhook 模式时必填。
        zh_Hant: 使用 Webhook 模式時必填。
      type: string
      required: false
      default: ""
      show_if:
        field: enable-webhook
        operator: eq
        value: true
    - name: EncodingAESKey
      label:
        en_US: EncodingAESKey
        zh_Hans: 消息加解密密钥 (EncodingAESKey)
        zh_Hant: 訊息加解密密鑰 (EncodingAESKey)
      description:
        en_US: Required for webhook mode. Long connections use the decryption key included in each message.
        zh_Hans: Webhook 模式必填。长连接模式使用消息自带的解密密钥。
        zh_Hant: Webhook 模式必填。長連線模式使用訊息自帶的解密金鑰。
      type: string
      required: false
      default: ""
      show_if:
        field: enable-webhook
        operator: eq
        value: true
    - name: enable-stream-reply
      label:
        en_US: Enable Stream Reply
        zh_Hans: 启用流式回复
        zh_Hant: 啟用串流回覆
      description:
        en_US: Used for streaming replies from pipelines or plugins. If enabled, the bot will use WeComBot streaming replies.
        zh_Hans: 用于流水线和插件主动发起的流式回复。如果启用，机器人将使用企业微信智能机器人流式回复。
        zh_Hant: 用於流水線和插件主動發起的串流回覆。如果啟用，機器人將使用企業微信智慧機器人串流回覆。
      type: boolean
      required: false
      default: true

  supported_events:
    - message.received
    - feedback.received
    - wecombot.enter_chat
    - wecombot.template_card_event
    - platform.specific

  supported_apis:
    required:
      - send_message
      - reply_message
    optional:
      - get_message
      - get_user_info
      - get_friend_list
      - get_group_info
      - get_group_member_info
      - get_group_member_list
      - call_platform_api
      - interaction.request

  platform_specific_apis:
    - action: is_websocket_mode
      description: { en_US: "Return whether the adapter is using WebSocket long connection mode", zh_Hans: "返回当前适配器是否使用 WebSocket 长连接模式" }
    - action: get_stream_session_status
      description: { en_US: "Inspect stream session state for a received message ID", zh_Hans: "按接收消息 ID 查看流式会话状态" }
    - action: send_markdown
      description: { en_US: "Send markdown text proactively in WebSocket mode", zh_Hans: "在 WebSocket 模式下主动发送 Markdown 文本" }

execution:
  python:
    path: ./adapter.py
    attr: WecomBotAdapter
