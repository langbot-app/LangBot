apiVersion: v1
kind: MessagePlatformAdapter

metadata:
  name: harness-omni
  label:
    en_US: LangBot Harness
    zh_Hans: LangBot Harness
    zh_Hant: LangBot Harness
    ja_JP: LangBot Harness
  description:
    en_US: LangBot Harness secure channel. One Bot per processor.
    zh_Hans: LangBot Harness 安全通道。每个处理器一个 Bot。
    zh_Hant: LangBot Harness 安全通道。每個處理器一個 Bot。
    ja_JP: LangBot Harness セキュアチャネル。プロセッサーごとに一つの Bot を使用します。
  icon: harness.svg

spec:
  categories: [integration]
  config: []
  supported_events:
    - message.received
  supported_apis:
    required: [send_message, reply_message]

execution:
  python:
    path: ./adapter.py
    attr: HarnessAdapter
