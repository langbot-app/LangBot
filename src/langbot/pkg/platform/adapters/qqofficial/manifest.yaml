apiVersion: v1
kind: MessagePlatformAdapter

metadata:
  name: qqofficial-omni
  label:
    en_US: QQ Official API
    zh_Hans: QQ 官方 API
    zh_Hant: QQ 官方 API
  description:
    en_US: QQ Official API adapter with event-driven orchestration support, using Webhook or WebSocket mode.
    zh_Hans: QQ 官方 API 适配器，支持事件驱动编排、Webhook 和 WebSocket 两种连接模式。
    zh_Hant: QQ 官方 API 適配器，支援事件驅動編排、Webhook 和 WebSocket 兩種連線模式。
  icon: qqofficial.svg

spec:
  categories:
    - china
  help_links:
    zh: https://langbot.app/docs/zh/usage/platforms/qq/official_webhook
    en: https://langbot.app/docs/en/usage/platforms/qq/official_webhook
    ja: https://langbot.app/docs/ja/usage/platforms/qq/official_webhook
  config:
    - name: __system.outbound_ips
      label:
        en_US: IP Whitelist
        zh_Hans: IP 白名单
        zh_Hant: IP 白名單
      description:
        en_US: Add these outbound IPs of the LangBot server to the IP whitelist in the development settings of the QQ Open Platform
        zh_Hans: 请将这些 LangBot 服务器的出网 IP 添加到 QQ 开放平台开发设置中的 IP 白名单
        zh_Hant: 請將這些 LangBot 伺服器的出網 IP 加入 QQ 開放平台開發設定中的 IP 白名單
      type: array[string]
      required: false
      default: []
    - name: one-click-bind
      label:
        en_US: One-Click QR Binding
        zh_Hans: 一键扫码绑定
        zh_Hant: 一鍵掃碼綁定
      description:
        en_US: Scan QR code with mobile QQ to auto-fill AppID and Secret (Token is not used and can be left blank)
        zh_Hans: 使用手机 QQ 扫码绑定，自动填写 AppID 和密钥（当前未使用 Token，可留空）
        zh_Hant: 使用手機 QQ 掃碼綁定，自動填寫 AppID 和密鑰（目前未使用 Token，可留空）
      type: qr-code-login
      login_platform: qqofficial
      required: false
    - name: enable-markdown-rendering
      label:
        en_US: Enable Markdown Rendering
        zh_Hans: 启用 Markdown 渲染
        zh_Hant: 啟用 Markdown 渲染
      description:
        en_US: Render non-stream C2C and QQ group text replies as Markdown. Channel messages always use plain text and are not
          affected by this setting.
        zh_Hans: 将非流式 C2C 私聊和 QQ 群聊文本回复渲染为 Markdown。频道消息始终以纯文本发送，不受此设置影响。
        zh_Hant: 將非串流 C2C 私聊與 QQ 群聊文字回覆渲染為 Markdown。頻道訊息一律以純文字傳送，不受此設定影響。
      type: boolean
      required: true
      default: false
    - name: appid
      label:
        en_US: App ID
        zh_Hans: 应用 ID
        zh_Hant: 應用 ID
      type: string
      required: true
      default: ""
    - name: secret
      label:
        en_US: Secret
        zh_Hans: 密钥
        zh_Hant: 密鑰
      type: string
      required: true
      default: ""
    - name: token
      label:
        en_US: Token
        zh_Hans: 令牌
        zh_Hant: 令牌
      type: string
      required: false
      default: ""
    - name: enable-webhook
      label:
        en_US: Enable Webhook Mode
        zh_Hans: 启用 Webhook 模式
        zh_Hant: 啟用 Webhook 模式
      description:
        en_US: If enabled, the bot receives messages through LangBot's unified webhook endpoint. Otherwise it uses the QQ WebSocket gateway.
        zh_Hans: 启用后，机器人通过 LangBot 统一 Webhook 接收消息；否则使用 QQ WebSocket 网关。
        zh_Hant: 啟用後，機器人透過 LangBot 統一 Webhook 接收訊息；否則使用 QQ WebSocket 閘道。
      type: boolean
      required: true
      default: false
    - name: enable-stream-reply
      label:
        en_US: Enable Stream Reply Mode
        zh_Hans: 启用流式回复模式
        zh_Hant: 啟用串流回覆模式
      description:
        en_US: Used for streaming replies from pipelines or plugins. If enabled, the adapter uses QQ Official streaming replies for C2C private messages.
        zh_Hans: 用于流水线和插件主动发起的流式回复。启用后，适配器会对 C2C 私聊使用 QQ 官方流式回复。
        zh_Hant: 用於流水線和插件主動發起的串流回覆。啟用後，適配器會對 C2C 私聊使用 QQ 官方串流回覆。
      type: boolean
      required: true
      default: false
    - name: webhook_url
      label:
        en_US: Webhook Callback URL
        zh_Hans: Webhook 回调地址
        zh_Hant: Webhook 回調地址
      description:
        en_US: Copy this URL and paste it into your QQ Official API webhook configuration.
        zh_Hans: 复制此地址并粘贴到 QQ 官方 API 的 Webhook 配置中。
        zh_Hant: 複製此地址並貼到 QQ 官方 API 的 Webhook 設定中。
      type: webhook-url
      required: false
      default: ""
      show_if:
        field: enable-webhook
        operator: eq
        value: true

  supported_events:
    - message.received
    - message.reaction
    - group.member_joined
    - group.member_left
    - bot.invited_to_group
    - bot.removed_from_group
    - platform.specific

  supported_apis:
    required:
      - send_message
      - reply_message
    optional:
      - get_message
      - get_user_info
      - get_friend_list
      - get_group_info
      - get_group_member_list
      - get_group_member_info
      - call_platform_api
      - interaction.request

  platform_specific_apis:
    - action: check_access_token
      description: { en_US: "Check whether the cached QQ Official access token is usable", zh_Hans: "检查当前缓存的 QQ 官方 access token 是否可用" }
    - action: refresh_access_token
      description: { en_US: "Force refresh the QQ Official access token", zh_Hans: "强制刷新 QQ 官方 access token" }
    - action: get_gateway_url
      description: { en_US: "Return the QQ Official WebSocket gateway URL", zh_Hans: "获取 QQ 官方 WebSocket 网关地址" }
    - action: get_mode
      description: { en_US: "Return adapter receive and stream-reply mode", zh_Hans: "返回适配器接收模式和流式回复模式" }

execution:
  python:
    path: ./adapter.py
    attr: QQOfficialAdapter
