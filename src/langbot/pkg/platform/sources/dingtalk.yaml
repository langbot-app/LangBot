apiVersion: v1
kind: MessagePlatformAdapter
metadata:
  name: dingtalk
  label:
    en_US: DingTalk
    zh_Hans: 钉钉
    zh_Hant: 釘釘
  description:
    en_US: DingTalk Adapter
    zh_Hans: 钉钉适配器，请查看文档了解使用方式
    zh_Hant: 釘釘適配器，請查看文件了解使用方式
  icon: dingtalk.svg
spec:
  legacy: true
  categories:
    - popular
    - china
  help_links:
    zh: https://langbot.app/docs/zh/usage/platforms/dingtalk
    en: https://langbot.app/docs/en/usage/platforms/dingtalk
    ja: https://langbot.app/docs/ja/usage/platforms/dingtalk
  config:
    - name: one-click-create
      label:
        en_US: One-Click Create App
        zh_Hans: 一键创建应用
        zh_Hant: 一鍵建立應用
      description:
        en_US: Scan with DingTalk to create an app and automatically fill in credentials. The bot identity is resolved automatically.
        zh_Hans: 使用钉钉扫码创建应用并自动填写凭据，机器人身份会自动识别。
        zh_Hant: 使用釘釘掃碼建立應用並自動填寫憑證，機器人身分會自動識別。
      type: qr-code-login
      login_platform: dingtalk
      required: false
    - name: client_id
      label:
        en_US: Client ID
        zh_Hans: 客户端ID
        zh_Hant: 用戶端ID
      type: string
      required: true
      default: ""
    - name: client_secret
      label:
        en_US: Client Secret
        zh_Hans: 客户端密钥
        zh_Hant: 用戶端密鑰
      type: string
      required: true
      default: ""
    - name: card_template_id
      label:
        en_US: card template id
        zh_Hans: 卡片模板ID
        zh_Hant: 卡片範本ID
      description:
        en_US: Template for streaming text replies. Save and publish it in DingTalk Card Platform, then paste its ID here to automatically enable streaming replies. Leave empty for ordinary replies. Separate from the human input template.
        zh_Hans: 用于流式文字回复。在钉钉卡片平台保存并发布模板后，填写 ID 即自动启用流式回复，留空使用普通回复；与人工输入卡片模板分开配置。
        zh_Hant: 用於串流文字回覆。在釘釘卡片平台儲存並發布範本後，填寫 ID 即自動啟用串流回覆，留空使用一般回覆；與人工輸入卡片範本分開設定。
      type: string
      required: false
      default: ""
    - name: stream_card_template_download
      label:
        en_US: Download Streaming Reply Card Template
        zh_Hans: 下载流式回复卡片模板
        zh_Hant: 下載串流回覆卡片範本
      description:
        en_US: Displays reasoning and the answer separately. Import through More > Import Card Template in the DingTalk AI card editor, save and publish, then paste its ID into Card Template ID above. Respects the pipeline thinking removal setting.
        zh_Hans: 分开展示思考与正文。在钉钉 AI 卡片编辑器中选择「更多 → 导入卡片模板」，保存并发布后，将 ID 填入上方「卡片模板 ID」。是否保留思考仍由流水线设置控制。
        zh_Hant: 分開展示思考與正文。在釘釘 AI 卡片編輯器中選擇「更多 → 匯入卡片範本」，儲存並發布後，將 ID 填入上方「卡片範本 ID」。是否保留思考仍由流水線設定控制。
      type: download-link
      required: false
      default: ''
      url: /api/v1/platform/adapters/dingtalk/stream-card-template
      download_filename: dingtalk_stream_card.json
    - name: markdown_card
      label:
        en_US: Markdown Card
        zh_Hans: 是否使用 Markdown 卡片
        zh_Hant: 是否使用 Markdown 卡片
      type: boolean
      required: false
      default: true
    - name: card_auto_layout
      label:
        en_US: Card Auto Layout
        zh_Hans: 卡片宽屏自动布局
        zh_Hant: 卡片寬螢幕自動佈局
      description:
        en_US: Enabled by default. Allows supported cards to adapt to wider windows. The LangBot streaming reply template includes the required variables; you can disable this for a narrower layout.
        zh_Hans: 默认开启，让支持的卡片适应较宽的聊天窗口。LangBot 流式回复模板已包含所需变量；如需较窄布局，可关闭此项。
        zh_Hant: 預設開啟，讓支援的卡片適應較寬的聊天視窗。LangBot 串流回覆範本已包含所需變數；如需較窄版面，可關閉此項。
      type: boolean
      required: false
      default: true
    - name: human_input_card_template_id
      label:
        en_US: Human Input Card Template ID
        zh_Hans: 人工输入卡片模板ID
        zh_Hant: 人工輸入卡片範本ID
      description:
        en_US: Optional. Used when a workflow or plugin requests user input, a choice, or confirmation before continuing (for example, a Dify Human Input node). Ordinary chat does not require it. Import the template below and enter its published ID here; streaming text replies use the separate Card Template ID.
        zh_Hans: 可选。当工作流或插件需要用户填写信息、选择选项或确认后再继续执行时使用，例如 Dify 的人工输入节点。普通聊天无需配置。请导入下方模板，将发布后的 ID 填在这里；流式文字回复使用单独的「卡片模板 ID」。
        zh_Hant: 可選。當工作流或外掛需要使用者填寫資訊、選擇選項或確認後再繼續執行時使用，例如 Dify 的人工輸入節點。一般聊天無需設定。請匯入下方範本，將發布後的 ID 填在這裡；串流文字回覆使用獨立的「卡片範本 ID」。
      type: string
      required: false
      default: ""
    - name: human_input_card_template_download
      label:
        en_US: Download Human Input Card Template
        zh_Hans: 下载人工输入卡片模板
        zh_Hant: 下載人工輸入卡片範本
      description:
        en_US: Download the human input template. Create an AI card in DingTalk Card Platform, choose More > Import Card Template in the editor, then save and publish. Paste its ID into the field above.
        zh_Hans: 下载人工输入模板后，在钉钉卡片平台新建 AI 卡片，在编辑器中选择「更多 → 导入卡片模板」，保存并发布，将 ID 填入上方字段。
        zh_Hant: 下載人工輸入範本後，在釘釘卡片平台新建 AI 卡片，在編輯器中選擇「更多 → 匯入卡片範本」，儲存並發布，將 ID 填入上方欄位。
      type: download-link
      required: false
      default: ""
      url: /api/v1/platform/adapters/dingtalk/human-input-card-template
      download_filename: dingtalk_human_input_card.json
      help_links:
        zh: https://langbot.app/docs/zh/usage/platforms/dingtalk#导入人工输入卡片模板
        en: https://open-dev.dingtalk.com/fe/card
        ja: https://open-dev.dingtalk.com/fe/card
      help_label:
        en_US: Import Guide
        zh_Hans: 导入指引
        zh_Hant: 匯入指引
        ja_JP: インポート手順
execution:
  python:
    path: ./dingtalk.py
    attr: DingTalkAdapter
