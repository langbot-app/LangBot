apiVersion: v1
kind: MessagePlatformAdapter
metadata:
  name: dingtalk
  label:
    en_US: DingTalk
    zh_Hans: 钉钉
    zh_Hant: 釘釘
  description:
    en_US: DingTalk Adapter
    zh_Hans: 钉钉适配器，请查看文档了解使用方式
    zh_Hant: 釘釘適配器，請查看文件了解使用方式
  icon: dingtalk.svg
spec:
  legacy: true
  categories:
    - popular
    - china
  help_links:
    zh: https://langbot.app/docs/zh/usage/platforms/dingtalk
    en: https://langbot.app/docs/en/usage/platforms/dingtalk
    ja: https://langbot.app/docs/ja/usage/platforms/dingtalk
  config:
    - name: one-click-create
      label:
        en_US: One-Click Create App
        zh_Hans: 一键创建应用
        zh_Hant: 一鍵建立應用
      description:
        en_US: Scan with DingTalk to create an app and automatically fill in credentials. The bot identity is resolved automatically.
        zh_Hans: 使用钉钉扫码创建应用并自动填写凭据，机器人身份会自动识别。
        zh_Hant: 使用釘釘掃碼建立應用並自動填寫憑證，機器人身分會自動識別。
      type: qr-code-login
      login_platform: dingtalk
      required: false
    - name: client_id
      label:
        en_US: Client ID
        zh_Hans: 客户端ID
        zh_Hant: 用戶端ID
      type: string
      required: true
      default: ""
    - name: client_secret
      label:
        en_US: Client Secret
        zh_Hans: 客户端密钥
        zh_Hant: 用戶端密鑰
      type: string
      required: true
      default: ""
    - name: markdown_card
      label:
        en_US: Use Card Replies
        zh_Hans: 使用卡片回复
        zh_Hant: 使用卡片回覆
      description:
        en_US: Uses built-in A2UI cards for Markdown, streaming replies, and interactions. No card template is required. The app must have AICard.Instance.Write permission.
        zh_Hans: 使用内置 A2UI 卡片提供 Markdown、流式回复和交互能力，无需配置卡片模板。应用必须开通 AICard.Instance.Write 权限。
        zh_Hant: 使用內建 A2UI 卡片提供 Markdown、串流回覆和互動能力，無需設定卡片範本。應用必須開通 AICard.Instance.Write 權限。
      type: boolean
      required: false
      default: true
execution:
  python:
    path: ./dingtalk.py
    attr: DingTalkAdapter
