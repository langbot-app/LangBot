apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: ClaudeCodeAgent
  version: 0.1.14
  repository: https://github.com/langbot-app/LangBot/tree/master/plugins/Runner/claude-code-agent
  label:
    en_US: Claude Code Agent
    zh_Hans: Claude Code Agent
    zh_Hant: Claude Code Agent
    ja_JP: Claude Code Agent
    th_TH: Claude Code Agent
    vi_VN: Claude Code Agent
    es_ES: Claude Code Agent
    ru_RU: Claude Code Agent
  description:
    en_US: Run Claude Code CLI as a LangBot Runner.
    zh_Hans: 将 Claude Code CLI 作为 LangBot 运行器运行。
    zh_Hant: 將 Claude Code CLI 作為 LangBot 運行器執行。
    ja_JP: Claude Code CLI を LangBot Runner として実行します。
    th_TH: เรียกใช้ Claude Code CLI เป็น LangBot Runner
    vi_VN: Chạy Claude Code CLI dưới dạng LangBot Runner.
    es_ES: Ejecuta Claude Code CLI como LangBot Runner.
    ru_RU: Запускает Claude Code CLI как LangBot Runner.
  icon: assets/icon.svg
spec:
  config:
    - name: daemon-enabled
      label:
        en_US: Enable Daemon Hub
        zh_Hans: 启用 Daemon Hub
      type: boolean
      required: false
      default: false
    - name: daemon-host
      label:
        en_US: Daemon Hub Host
        zh_Hans: Daemon Hub 监听地址
      type: string
      required: false
      default: 127.0.0.1
    - name: daemon-port
      label:
        en_US: Daemon Hub Port
        zh_Hans: Daemon Hub 端口
      type: integer
      required: false
      default: 8767
    - name: daemon-token
      label:
        en_US: Daemon Token
        zh_Hans: Daemon Token
      type: secret
      required: false
      default: ''
  components:
    Runner:
      fromDirs:
        - path: components/runner/
  pages: []
execution:
  python:
    path: main.py
    attr: ClaudeCodeAgentPlugin
