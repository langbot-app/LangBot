apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: MulticaAgent
  version: 0.2.2
  repository: https://github.com/langbot-app/LangBot/tree/master/plugins/Runner/multica-agent
  label:
    en_US: External Agent Chat
    zh_Hans: 外部智能体对话
    zh_Hant: 外部智慧體對話
    ja_JP: 外部エージェントとのチャット
    th_TH: แชทกับเอเจนต์ภายนอก
    vi_VN: Trò chuyện với tác nhân bên ngoài
    es_ES: Chat con un agente externo
    ru_RU: Чат с внешним агентом
  description:
    en_US: Routes LangBot conversations to a configured Multica agent.
    zh_Hans: 将 LangBot 会话转发给已配置的 Multica 智能体。
    zh_Hant: 將 LangBot 對話轉發給已設定的 Multica 智慧體。
    ja_JP: LangBot の会話を設定済みの Multica エージェントに転送します。
    th_TH: ส่งต่อบทสนทนาใน LangBot ไปยังเอเจนต์ Multica ที่ตั้งค่าไว้
    vi_VN: Chuyển tiếp cuộc trò chuyện trong LangBot đến tác nhân Multica đã cấu hình.
    es_ES: Enruta las conversaciones de LangBot a un agente de Multica configurado.
    ru_RU: Перенаправляет диалоги LangBot настроенному агенту Multica.
  icon: assets/icon.svg
spec:
  config:
    - name: language
      label:
        en_US: Language
        zh_Hans: 语言
      description:
        en_US: Language of this plugin's own chat output (progress lines, commands, errors). The agent's answer is never translated.
        zh_Hans: 插件自身聊天输出（进度、命令、错误提示）的语言。智能体的回答正文不会被翻译。
      type: select
      required: false
      default: en_US
      options:
        - name: en_US
          label: {en_US: English, zh_Hans: 英文}
        - name: zh_Hans
          label: {en_US: Simplified Chinese, zh_Hans: 简体中文}
        - name: zh_Hant
          label: {en_US: Traditional Chinese, zh_Hans: 繁体中文}
        - name: ja_JP
          label: {en_US: Japanese, zh_Hans: 日语}
        - name: es_ES
          label: {en_US: Spanish, zh_Hans: 西班牙语}
        - name: ru_RU
          label: {en_US: Russian, zh_Hans: 俄语}
        - name: th_TH
          label: {en_US: Thai, zh_Hans: 泰语}
        - name: vi_VN
          label: {en_US: Vietnamese, zh_Hans: 越南语}
  components:
    Runner:
      fromDirs:
        - path: components/runner/
  pages: []
execution:
  python:
    path: main.py
    attr: MulticaAgentPlugin
  sharedRuntime: shared-runtime-v1
  componentModel: stateless-v1
