apiVersion: v1
kind: Command
metadata:
  name: switch
  label:
    en_US: Switch ACP session
    zh_Hans: 切换 ACP 会话
  description:
    en_US: Switch to an existing session for an ACP client with session management support
    zh_Hans: 切换到支持会话管理的 ACP 客户端已有会话
spec:
execution:
  python:
    path: session_commands.py
    attr: SwitchSession
