apiVersion: v1
kind: Command
metadata:
  name: switch
  label:
    en_US: Switch ACP session
    zh_Hans: 切换 ACP 会话
  description:
    en_US: Switch to an existing OpenCode ACP session
    zh_Hans: 切换到已有 OpenCode ACP 会话
spec:
execution:
  python:
    path: session_commands.py
    attr: SwitchSession
