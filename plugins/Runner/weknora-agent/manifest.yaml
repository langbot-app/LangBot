apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: WeKnoraAgent
  version: 0.2.3
  repository: https://github.com/langbot-app/LangBot/tree/master/plugins/Runner/weknora-agent
  label:
    en_US: WeKnora Agent
    zh_Hans: WeKnora Agent
    zh_Hant: WeKnora Agent
    ja_JP: WeKnora Agent
    th_TH: WeKnora Agent
    vi_VN: WeKnora Agent
    es_ES: Agente WeKnora
    ru_RU: Агент WeKnora
  description:
    en_US: Run a WeKnora agent or knowledge-base chat app as a LangBot Runner.
    zh_Hans: 将 WeKnora 智能体或知识库问答应用作为 LangBot 运行器运行。
    zh_Hant: 將 WeKnora 代理或知識庫聊天應用程式作為 LangBot 運行器執行。
    ja_JP: WeKnora エージェントまたはナレッジベースチャットを LangBot Runner として実行します。
    th_TH: เรียกใช้เอเจนต์ WeKnora หรือแอปแชตฐานความรู้เป็น LangBot Runner
    vi_VN: Chạy tác nhân WeKnora hoặc ứng dụng trò chuyện kho tri thức dưới dạng LangBot Runner.
    es_ES: Ejecuta un agente WeKnora o una aplicación de chat con base de conocimiento como LangBot Runner.
    ru_RU: Запускает агент WeKnora или чат с базой знаний как LangBot Runner.
  icon: assets/icon.svg
spec:
  config: []
  components:
    Runner:
      fromDirs:
        - path: components/runner/
  pages: []
execution:
  python:
    path: main.py
    attr: WeKnoraAgentPlugin
  sharedRuntime: shared-runtime-v1
  componentModel: stateless-v1
