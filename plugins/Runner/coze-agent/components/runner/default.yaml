apiVersion: langbot/v1
kind: Runner
metadata:
  name: default
  label:
    en_US: Coze
    zh_Hans: 扣子
  description:
    en_US: Run a Coze bot as a LangBot Runner.
    zh_Hans: 将扣子机器人作为 LangBot 运行器运行。
spec:
  usages: [agent]
  config:
    - name: user-id-source
      label:
        en_US: Provider User Identity
        zh_Hans: 供应商用户身份
      description:
        en_US: Sender is the default. Legacy mode requires trusted Host identity; missing identity fails closed. Does not import old sessions.
        zh_Hans: 默认使用发送者身份。兼容模式需要可信 Host 身份，缺失时拒绝请求；不会导入旧会话。
      type: select
      required: false
      default: sender
      options:
        - name: sender
          label: {en_US: Sender, zh_Hans: 发送者}
        - name: legacy-session
          label: {en_US: Native identity compatibility, zh_Hans: 原生身份兼容}
    - name: remove-think
      label:
        en_US: Hide reasoning
        zh_Hans: 隐藏思考过程
      description:
        en_US: Hide reasoning fields and think blocks without removing answer or tool content.
        zh_Hans: 隐藏推理字段和思考块，保留正文和工具内容。
      type: boolean
      required: false
      default: false
    - name: api-key
      label:
        en_US: API Key
        zh_Hans: API 密钥
      type: secret
      required: true
      default: ''
    - name: bot-id
      label:
        en_US: Bot ID
        zh_Hans: 机器人 ID
      type: string
      required: true
      default: ''
    - name: api-base
      label:
        en_US: API Base URL
        zh_Hans: API 基础 URL
      type: string
      required: true
      default: "https://api.coze.cn"
      description:
        en_US: Coze China, Global, or a trusted custom HTTP(S) endpoint (including a path prefix).
        zh_Hans: 扣子中国版、全球版或可信的自定义 HTTP(S) 地址（支持路径前缀）。
    - name: advanced-settings
      label:
        en_US: Advanced Settings
        zh_Hans: 高级设置
      description:
        en_US: Show history and timeout tuning controls.
        zh_Hans: 显示历史和超时调优选项。
      type: boolean
      required: false
      default: false
    - name: auto-save-history
      label:
        en_US: Auto Save History
        zh_Hans: 自动保存历史
      type: boolean
      required: false
      default: true
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: timeout
      label:
        en_US: Request Timeout
        zh_Hans: 请求超时
      type: number
      required: false
      default: 120
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: langbot-assets-enabled
      label:
        en_US: Enable LangBot Assets
        zh_Hans: 启用 LangBot 资产
      type: boolean
      required: false
      default: false
    - name: langbot-assets-gateway-host
      label:
        en_US: LangBot Asset Gateway Host
        zh_Hans: LangBot 资产网关监听地址
      type: string
      required: false
      default: '0.0.0.0'
      show_if:
        field: langbot-assets-enabled
        operator: eq
        value: true
    - name: langbot-assets-gateway-port
      label:
        en_US: LangBot Asset Gateway Port
        zh_Hans: LangBot 资产网关端口
      type: integer
      required: false
      default: 8765
      show_if:
        field: langbot-assets-enabled
        operator: eq
        value: true
    - name: langbot-assets-gateway-request-timeout
      label:
        en_US: LangBot Asset Gateway Request Timeout
        zh_Hans: LangBot 资产网关请求超时
      type: integer
      required: false
      default: 60
      show_if:
        field: langbot-assets-enabled
        operator: eq
        value: true
    - name: langbot-assets-token-ttl
      label:
        en_US: LangBot Asset Token TTL
        zh_Hans: LangBot 资产令牌有效期
      type: integer
      required: false
      default: 3600
      show_if:
        field: langbot-assets-enabled
        operator: eq
        value: true
    - name: langbot-assets-input-name
      label:
        en_US: LangBot Asset Token Input Name
        zh_Hans: LangBot 资产令牌输入变量名
      type: string
      required: false
      default: 'langbot_asset_run_token'
      show_if:
        field: langbot-assets-enabled
        operator: eq
        value: true
  capabilities:
    streaming: true
    tool_calling: true
    knowledge_retrieval: true
    multimodal_input: true
    interrupt: false
  permissions:
    tools:
      - detail
      - call
    knowledge_bases:
      - retrieve
    history:
      - page
    storage:
      - plugin
execution:
  python:
    path: default.py
    attr: DefaultRunner
