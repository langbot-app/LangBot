apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: DeerFlowAgent
  version: 0.2.1
  repository: https://github.com/langbot-app/LangBot/tree/master/plugins/Runner/deerflow-agent
  label:
    en_US: DeerFlow Agent
    zh_Hans: DeerFlow Agent
    zh_Hant: DeerFlow Agent
    ja_JP: DeerFlow Agent
    th_TH: DeerFlow Agent
    vi_VN: DeerFlow Agent
    es_ES: Agente DeerFlow
    ru_RU: Агент DeerFlow
  description:
    en_US: Run a DeerFlow LangGraph agent as a LangBot Runner.
    zh_Hans: 将 DeerFlow LangGraph 智能体作为 LangBot 运行器运行。
    zh_Hant: 將 DeerFlow LangGraph 代理作為 LangBot 運行器執行。
    ja_JP: DeerFlow LangGraph エージェントを LangBot Runner として実行します。
    th_TH: เรียกใช้เอเจนต์ DeerFlow LangGraph เป็น LangBot Runner
    vi_VN: Chạy tác nhân DeerFlow LangGraph dưới dạng LangBot Runner.
    es_ES: Ejecuta un agente DeerFlow LangGraph como LangBot Runner.
    ru_RU: Запускает агент DeerFlow LangGraph как LangBot Runner.
  icon: assets/icon.svg
spec:
  config: []
  components:
    Runner:
      fromDirs:
        - path: components/runner/
  pages: []
execution:
  python:
    path: main.py
    attr: DeerFlowAgentPlugin
  sharedRuntime: shared-runtime-v1
  componentModel: stateless-v1
