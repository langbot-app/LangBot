apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: CodexAgent
  version: 0.1.20
  repository: https://github.com/langbot-app/LangBot/tree/master/plugins/Runner/codex-agent
  label:
    en_US: Codex Agent
    zh_Hans: Codex Agent
    zh_Hant: Codex Agent
    ja_JP: Codex Agent
    th_TH: Codex Agent
    vi_VN: Codex Agent
    es_ES: Codex Agent
    ru_RU: Codex Agent
  description:
    en_US: Run Codex CLI as a LangBot Runner.
    zh_Hans: 将 Codex CLI 作为 LangBot 运行器运行。
    zh_Hant: 將 Codex CLI 作為 LangBot 運行器執行。
    ja_JP: Codex CLI を LangBot Runner として実行します。
    th_TH: เรียกใช้ Codex CLI เป็น LangBot Runner
    vi_VN: Chạy Codex CLI dưới dạng LangBot Runner.
    es_ES: Ejecuta Codex CLI como LangBot Runner.
    ru_RU: Запускает Codex CLI как LangBot Runner.
  icon: assets/icon.svg
spec:
  config:
    - name: daemon-enabled
      label:
        en_US: Enable Daemon Hub
        zh_Hans: 启用 Daemon Hub
      type: boolean
      required: false
      default: false
    - name: daemon-host
      label:
        en_US: Daemon Hub Host
        zh_Hans: Daemon Hub 监听地址
      type: string
      required: false
      default: 127.0.0.1
    - name: daemon-port
      label:
        en_US: Daemon Hub Port
        zh_Hans: Daemon Hub 端口
      type: integer
      required: false
      default: 8768
    - name: daemon-token
      label:
        en_US: Daemon Token
        zh_Hans: Daemon Token
      type: secret
      required: false
      default: ''
  components:
    Runner:
      fromDirs:
        - path: components/runner/
  pages: []
execution:
  python:
    path: main.py
    attr: CodexAgentPlugin
