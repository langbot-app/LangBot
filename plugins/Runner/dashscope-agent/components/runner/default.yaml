apiVersion: langbot/v1
kind: Runner
metadata:
  name: default
  label:
    en_US: DashScope
    zh_Hans: 百炼
  description:
    en_US: Run an Aliyun DashScope application as a LangBot Runner.
    zh_Hans: 将阿里云百炼应用作为 LangBot 运行器运行。
spec:
  usages: [agent]
  config:
    - name: remove-think
      label:
        en_US: Hide reasoning
        zh_Hans: 隐藏思考过程
      description:
        en_US: Hide reasoning fields and think blocks without removing answer or tool content.
        zh_Hans: 隐藏推理字段和思考块，保留正文和工具内容。
      type: boolean
      required: false
      default: false
    - name: app-type
      label:
        en_US: App Type
        zh_Hans: 应用类型
      type: select
      required: true
      default: agent
      options:
        - name: agent
          label:
            en_US: Agent
            zh_Hans: Agent
        - name: workflow
          label:
            en_US: Workflow
            zh_Hans: 工作流
    - name: api-key
      label:
        en_US: API Key
        zh_Hans: API 密钥
      type: secret
      required: true
      default: ''
    - name: app-id
      label:
        en_US: App ID
        zh_Hans: 应用 ID
      type: string
      required: true
      default: ''
    - name: advanced-settings
      label:
        en_US: Advanced Settings
        zh_Hans: 高级设置
      description:
        en_US: Show reference formatting and timeout tuning controls.
        zh_Hans: 显示引用格式和超时调优选项。
      type: boolean
      required: false
      default: false
    - name: references_quote
      label:
        en_US: References Quote
        zh_Hans: 引用文本
      type: string
      required: false
      default: '参考资料来自:'
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: timeout
      label:
        en_US: Timeout
        zh_Hans: 超时时间
      type: number
      required: false
      default: 120
      show_if:
        field: advanced-settings
        operator: eq
        value: true
    - name: langbot-assets-enabled
      label:
        en_US: Enable LangBot Assets
        zh_Hans: 启用 LangBot 资产
      type: boolean
      required: false
      default: false
    - name: langbot-assets-gateway-host
      label:
        en_US: LangBot Asset Gateway Host
        zh_Hans: LangBot 资产网关监听地址
      type: string
      required: false
      default: '0.0.0.0'
      show_if:
        field: langbot-assets-enabled
        operator: eq
        value: true
    - name: langbot-assets-gateway-port
      label:
        en_US: LangBot Asset Gateway Port
        zh_Hans: LangBot 资产网关端口
      type: integer
      required: false
      default: 8765
      show_if:
        field: langbot-assets-enabled
        operator: eq
        value: true
    - name: langbot-assets-gateway-request-timeout
      label:
        en_US: LangBot Asset Gateway Request Timeout
        zh_Hans: LangBot 资产网关请求超时
      type: integer
      required: false
      default: 60
      show_if:
        field: langbot-assets-enabled
        operator: eq
        value: true
    - name: langbot-assets-token-ttl
      label:
        en_US: LangBot Asset Token TTL
        zh_Hans: LangBot 资产令牌有效期
      type: integer
      required: false
      default: 3600
      show_if:
        field: langbot-assets-enabled
        operator: eq
        value: true
    - name: langbot-assets-input-name
      label:
        en_US: LangBot Asset Token Input Name
        zh_Hans: LangBot 资产令牌输入变量名
      type: string
      required: false
      default: 'langbot_asset_run_token'
      show_if:
        field: langbot-assets-enabled
        operator: eq
        value: true
  capabilities:
    streaming: true
    tool_calling: true
    knowledge_retrieval: true
    multimodal_input: false
    interrupt: false
  permissions:
    tools:
      - detail
      - call
    knowledge_bases:
      - retrieve
    history:
      - page
    storage:
      - plugin
execution:
  python:
    path: default.py
    attr: DefaultRunner
