apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: LangflowAgent
  version: 0.2.2
  repository: https://github.com/langbot-app/LangBot/tree/master/plugins/Runner/langflow-agent
  label:
    en_US: Langflow Agent
    zh_Hans: Langflow Agent
    zh_Hant: Langflow Agent
    ja_JP: Langflow Agent
    th_TH: Langflow Agent
    vi_VN: Langflow Agent
    es_ES: Agente Langflow
    ru_RU: Агент Langflow
  description:
    en_US: Run a Langflow flow as a LangBot Runner.
    zh_Hans: 将 Langflow 流程作为 LangBot 运行器运行。
    zh_Hant: 將 Langflow 流程作為 LangBot 運行器執行。
    ja_JP: Langflow フローを LangBot Runner として実行します。
    th_TH: เรียกใช้โฟลว์ Langflow เป็น LangBot Runner
    vi_VN: Chạy luồng Langflow dưới dạng LangBot Runner.
    es_ES: Ejecuta un flujo de Langflow como LangBot Runner.
    ru_RU: Запускает поток Langflow как LangBot Runner.
  icon: assets/icon.svg
spec:
  config: []
  components:
    Runner:
      fromDirs:
        - path: components/runner/
  pages: []
execution:
  python:
    path: main.py
    attr: LangflowAgentPlugin
  sharedRuntime: shared-runtime-v1
  componentModel: stateless-v1
