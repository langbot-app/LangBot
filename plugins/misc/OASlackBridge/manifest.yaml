apiVersion: v1
kind: Plugin
metadata:
  author: langbot-team
  name: OASlackBridge
  repository: https://github.com/langbot-app/LangBot/tree/master/plugins/misc/OASlackBridge
  version: 0.3.0
  description:
    en_US: Forward Official Account keyword messages to Slack and reply from threads.
    zh_Hans: 公众号关键词消息转发 Slack，员工在 thread 内回复用户。
    zh_Hant: 公眾號關鍵字訊息轉發至 Slack，員工在討論串內回覆使用者。
    ja_JP: 公式アカウントのキーワードメッセージを Slack に転送し、スレッドから返信します。
    es_ES: Reenvía mensajes con palabras clave de cuentas oficiales a Slack y responde desde hilos.
    ru_RU: Пересылает сообщения официального аккаунта по ключевым словам в Slack с ответами из веток.
    th_TH: ส่งต่อข้อความที่มีคำสำคัญจากบัญชีทางการไปยัง Slack และตอบกลับจากเธรด
    vi_VN: Chuyển tiếp tin nhắn có từ khóa từ tài khoản chính thức đến Slack và trả lời từ luồng.
  label:
    en_US: Official Account Slack Bridge
    zh_Hans: 公众号 Slack 桥接
    zh_Hant: 公眾號 Slack 橋接
    ja_JP: 公式アカウント Slack ブリッジ
    es_ES: Puente de cuentas oficiales a Slack
    ru_RU: Мост между официальным аккаунтом и Slack
    th_TH: สะพานเชื่อมบัญชีทางการกับ Slack
    vi_VN: Cầu nối tài khoản chính thức với Slack
  icon: assets/icon.svg
spec:
  permissions:
    capabilities: [bot.message.send, storage.plugin]
    workspace_operations: []
  config:
    - name: oa_bot
      type: bot-selector
      required: true
      label:
        en_US: Official Account bot (auto mode)
        zh_Hans: 公众号 Bot（auto 模式）
    - name: slack_bot
      type: bot-selector
      required: true
      label:
        en_US: Slack bot
        zh_Hans: Slack Bot
    - name: slack_channel_id
      type: string
      required: true
      label:
        en_US: Slack channel ID
        zh_Hans: Slack 频道 ID
    - name: keywords
      type: array[string]
      default: []
      label:
        en_US: Takeover keywords
        zh_Hans: 接管关键词
    - name: case_sensitive
      type: boolean
      default: false
      label:
        en_US: Case-sensitive matching
        zh_Hans: 区分大小写
    - name: takeover_minutes
      type: integer
      default: 60
      label:
        en_US: Takeover duration (minutes)
        zh_Hans: 接管时长（分钟）
    - name: forward_followups
      type: boolean
      default: true
      label:
        en_US: Forward follow-up messages
        zh_Hans: 转发接管期间的后续消息
    - name: start_notice
      type: string
      default: "已为您转接人工客服，请稍候，客服会在这里回复您。"
      label:
        en_US: Notice to the user when takeover starts
        zh_Hans: 进入人工时发给用户的提示
      description:
        en_US: Sent to the Official Account user when a keyword starts a takeover. Leave empty to disable.
        zh_Hans: 命中关键词进入人工接管时发给公众号用户。留空则不发送。
    - name: end_notice
      type: string
      default: "人工客服已结束本次服务，后续将由 AI 助手继续为您解答。"
      label:
        en_US: Notice to the user when takeover ends
        zh_Hans: 退出人工时发给用户的提示
      description:
        en_US: Sent to the Official Account user when staff send !close or the takeover expires. Not sent after the 48-hour reply window. Leave empty to disable.
        zh_Hans: 员工发送 !close 或接管到期时发给公众号用户；超过 48 小时回复窗口时不发送。留空则不发送。
  components:
    Runner:
      fromDirs:
        - path: components/runner/
    EventListener:
      fromDirs:
        - path: components/event_listener/
execution:
  python:
    path: main.py
    attr: OASlackBridge
  sharedRuntime: shared-runtime-v1
  componentModel: stateless-v1
