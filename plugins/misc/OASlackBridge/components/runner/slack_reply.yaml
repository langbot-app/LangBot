apiVersion: langbot/v1
kind: Runner
metadata:
  name: slack_reply
  label:
    en_US: Slack reply processor
    zh_Hans: Slack 回复处理器
    zh_Hant: Slack 回覆處理器
    ja_JP: Slack 返信プロセッサー
    es_ES: Procesador de respuestas de Slack
    ru_RU: Обработчик ответов Slack
    th_TH: ตัวประมวลผลการตอบกลับ Slack
    vi_VN: Bộ xử lý trả lời Slack
  description:
    en_US: Send mapped Slack thread replies to Official Account users.
    zh_Hans: 将已映射的 Slack thread 回复发送给公众号用户。
    zh_Hant: 將已對應的 Slack 討論串回覆傳送給公眾號使用者。
    ja_JP: 対応する Slack スレッドの返信を公式アカウントのユーザーに送信します。
    es_ES: Envía respuestas de hilos vinculados de Slack a usuarios de cuentas oficiales.
    ru_RU: Отправляет ответы из связанных веток Slack пользователям официального аккаунта.
    th_TH: ส่งคำตอบจากเธรด Slack ที่เชื่อมโยงไปยังผู้ใช้บัญชีทางการ
    vi_VN: Gửi trả lời từ luồng Slack đã liên kết đến người dùng tài khoản chính thức.
spec:
  usages: [event]
  events: [message.received]
  config: []
  capabilities:
    tool_calling: true
  permissions:
    tools: [call]
    storage: [plugin]
execution:
  python:
    path: slack_reply.py
    attr: SlackReplyProcessor
