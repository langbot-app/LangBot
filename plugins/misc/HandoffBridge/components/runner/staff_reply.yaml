apiVersion: langbot/v1
kind: Runner
metadata:
  name: staff_reply
  label:
    en_US: Staff reply processor
    zh_Hans: 员工回复处理器
    zh_Hant: 員工回覆處理器
    ja_JP: 担当者返信プロセッサー
    es_ES: Procesador de respuestas del personal
    ru_RU: Обработчик ответов сотрудников
    th_TH: ตัวประมวลผลคำตอบของเจ้าหน้าที่
    vi_VN: Bộ xử lý phản hồi của nhân viên
  description:
    en_US: Send staff replies to linked handoff requests back to the user, and handle !close.
    zh_Hans: 把员工对转人工请求的回复发回给用户，并处理 !close。
    zh_Hant: 將員工對轉接請求的回覆傳回給使用者，並處理 !close。
    ja_JP: 引き継ぎリクエストへの担当者の返信をユーザーに送り、!close を処理します。
    es_ES: Envía al usuario las respuestas del personal a solicitudes vinculadas y gestiona !close.
    ru_RU: Отправляет пользователю ответы сотрудников на связанные запросы и обрабатывает !close.
    th_TH: ส่งคำตอบของเจ้าหน้าที่ต่อคำขอที่เชื่อมโยงกลับไปยังผู้ใช้ และจัดการ !close
    vi_VN: Gửi phản hồi của nhân viên cho yêu cầu đã liên kết về người dùng và xử lý !close.
spec:
  usages: [event]
  events: [message.received]
  config: []
  capabilities:
    tool_calling: true
  permissions:
    tools: [call]
    storage: [plugin]
execution:
  python:
    path: staff_reply.py
    attr: StaffReplyProcessor
