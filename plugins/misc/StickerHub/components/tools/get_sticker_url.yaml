apiVersion: v1
kind: Tool
metadata:
  name: stickerhub_get_sticker_url
  label:
    en_US: Get Sticker URL
    zh_Hans: 获取表情包地址
  description:
    en_US: Get the stable URL of a stored sticker by its name.
    zh_Hans: 按名称获取已存储表情包的稳定地址。
spec:
  parameters:
    type: object
    properties:
      name:
        type: string
        description: 'Name of a sticker previously stored with stickerhub_add_sticker.'
    required:
      - name
  llm_prompt: 'Get the stable URL of a stored sticker by name.'
execution:
  python:
    path: get_sticker_url.py
    attr: GetStickerUrl
