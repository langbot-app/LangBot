name: Sync landing docs submodule

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-landing-docs-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'langbot-app/langbot-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test synchronization contracts
        run: python3 -m unittest discover -s tests -p test_sync_landing_submodule.py -v
      - name: Update landing submodule and production fork
        env:
          GH_TOKEN: ${{ secrets.LANGBOT_WIKI_PUSH_TOKEN }}
        run: python3 scripts/sync-landing-submodule.py
